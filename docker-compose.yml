# Dependencies only: Postgres and a local fake SQS (ElasticMQ).
#
# In Part 1 you run the application services yourself with Python.
# In Part 3 you will add your own containerized services to this file.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324"   # SQS-compatible API
      - "9325:9325"   # web UI: http://localhost:9325 (queue sizes, including the DLQ)
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf
