# Local stand-in for Amazon SQS, used only by docker-compose.
# It creates the same two queues you will build in Terraform later:
#   orders      the main queue
#   orders-dlq  the dead-letter queue. After 3 failed receives, a message moves here.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

queues {
  orders-dlq {
    defaultVisibilityTimeout = 10 seconds
  }
  orders {
    defaultVisibilityTimeout = 10 seconds
    deadLettersQueue {
      name = "orders-dlq"
      maxReceiveCount = 3
    }
  }
}
